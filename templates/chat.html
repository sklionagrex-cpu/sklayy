<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:Arial,sans-serif; background:#0b0b0f; color:#fff; height:100vh; display:flex; flex-direction:column; }
    .header { padding:12px 16px; background:#1a1a1f; border-bottom:1px solid #333; display:flex; align-items:center; gap:12px; flex-shrink:0; }
    .header a { color:#fff; font-size:20px; text-decoration:none; }
    .header .avatar { width:36px; height:36px; border-radius:50%; background:#333; display:flex; align-items:center; justify-content:center; font-size:18px; }
    .header .name { font-weight:600; }
    .header .status { font-size:12px; color:#888; }
    .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; }
    .msg { max-width:70%; padding:8px 14px; border-radius:16px; font-size:14px; line-height:1.4; }
    .msg.mine { align-self:flex-end; background:#5B6CFF; border-bottom-right-radius:4px; }
    .msg.other { align-self:flex-start; background:#2a2a2f; border-bottom-left-radius:4px; }
    .msg .time { font-size:10px; opacity:0.5; margin-top:4px; display:block; text-align:right; }
    .input-area { display:flex; gap:8px; padding:10px 16px; background:#1a1a1f; border-top:1px solid #333; flex-shrink:0; align-items:flex-end; }
    .input-area textarea { flex:1; padding:8px 12px; border-radius:12px; border:1px solid #333; background:#0b0b0f; color:#fff; font-size:14px; resize:none; outline:none; min-height:36px; max-height:100px; font-family:Arial,sans-serif; }
    .input-area textarea:focus { border-color:#5B6CFF; }
    .input-area button { background:none; border:none; color:#888; font-size:18px; cursor:pointer; padding:6px 8px; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; }
    .input-area button:hover { background:#2a2a2f; color:#fff; }
    .input-area .send { background:#5B6CFF; color:#fff; }
    .input-area .send:hover { background:#4a5ae0; }
    #fileInput { display:none; }
    .empty { text-align:center; color:#666; padding:40px 20px; }
    .empty .icon { font-size:40px; margin-bottom:10px; opacity:0.3; }
  </style>
</head>
<body>
<div class="header">
  <a href="/app"><i class="fas fa-arrow-left"></i></a>
  <div class="avatar" id="chatAvatar">👤</div>
  <div>
    <div class="name" id="chatTitle">{{ chat_name }}</div>
    <div class="status" id="chatStatus">онлайн</div>
  </div>
</div>

<div class="messages" id="chatMessages">
  <div id="messagesContainer">
    <div class="empty">
      <div class="icon">💬</div>
      <div>Нет сообщений</div>
      <div style="font-size:13px;color:#555;margin-top:4px;">Напишите первое сообщение</div>
    </div>
  </div>
</div>

<div class="input-area">
  <button onclick="document.getElementById('fileInput').click()" title="Файл"><i class="fas fa-paperclip"></i></button>
  <input type="file" id="fileInput" accept="image/*,video/*" onchange="uploadFile(this)">
  <textarea id="messageInput" rows="1" placeholder="Сообщение..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
  <button class="send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
const chatId = {{ chat.id }};
const currentUserId = {{ session['user_id'] }};
let socket = null;

function loadUserInfo() {
  fetch('/api/chat_users/' + chatId)
    .then(res => res.json())
    .then(data => {
      if (data && data.username) {
        const avatarEl = document.getElementById('chatAvatar');
        if (data.avatar && data.avatar.startsWith('/static/uploads/')) {
          avatarEl.innerHTML = '<img src="' + data.avatar + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
        } else {
          avatarEl.textContent = data.avatar || '👤';
        }
        document.getElementById('chatStatus').textContent = data.online ? '🟢 Онлайн' : '⚪ Не в сети';
      }
    })
    .catch(err => console.error('Ошибка загрузки:', err));
}

function connectSocket() {
  socket = io();
  socket.on('connect', () => {
    console.log('WebSocket подключен');
    socket.emit('join_chat', { chat_id: chatId });
  });
  socket.on('new_message', (data) => {
    if (data.chat_id == chatId) addMessage(data);
  });
}

function loadMessages() {
  fetch('/api/messages/' + chatId)
    .then(res => res.json())
    .then(messages => {
      const container = document.getElementById('messagesContainer');
      if (!messages || messages.length === 0) {
        container.innerHTML = '<div class="empty"><div class="icon">💬</div><div>Нет сообщений</div><div style="font-size:13px;color:#555;margin-top:4px;">Напишите первое сообщение</div></div>';
        return;
      }
      container.innerHTML = messages.map(msg => {
        const isMine = msg.user_id == currentUserId;
        let fileHtml = '';
        if (msg.file_url) {
          if (msg.file_url.match(/\.(mp4|webm|ogg)$/i)) {
            fileHtml = '<div style="margin-top:4px;"><video controls style="max-width:180px;border-radius:8px;"><source src="' + msg.file_url + '" type="video/mp4"></video></div>';
          } else {
            fileHtml = '<div style="margin-top:4px;"><img src="' + msg.file_url + '" style="max-width:180px;border-radius:8px;" alt="Изображение"></div>';
          }
        }
        return '<div class="msg ' + (isMine ? 'mine' : 'other') + '">' + (isMine ? '' : '<div style="font-size:12px;font-weight:600;color:#5B6CFF;margin-bottom:2px;">' + (msg.full_name || msg.username) + '</div>') + (msg.content || '') + fileHtml + '<span class="time">' + new Date(msg.created_at).toLocaleTimeString() + '</span></div>';
      }).join('');
      scrollToBottom();
    })
    .catch(err => console.error('Ошибка загрузки сообщений:', err));
}

function sendMessage() {
  const input = document.getElementById('messageInput');
  const content = input.value.trim();
  if (!content) return;
  socket.emit('send_message', { chat_id: chatId, content: content });
  input.value = '';
  input.style.height = 'auto';
}

function uploadFile(input) {
  const file = input.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('media', file);
  fetch('/api/upload_media', {
    method: 'POST',
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if (data.url) {
      socket.emit('send_message', { chat_id: chatId, content: '📎 Файл', file_url: data.url });
    }
  })
  .catch(err => console.error('Ошибка загрузки файла:', err));
  input.value = '';
}

function addMessage(msg) {
  const container = document.getElementById('messagesContainer');
  const empty = container.querySelector('.empty');
  if (empty) container.innerHTML = '';
  const isMine = msg.user_id == currentUserId;
  let fileHtml = '';
  if (msg.file_url) {
    if (msg.file_url.match(/\.(mp4|webm|ogg)$/i)) {
      fileHtml = '<div style="margin-top:4px;"><video controls style="max-width:180px;border-radius:8px;"><source src="' + msg.file_url + '" type="video/mp4"></video></div>';
    } else {
      fileHtml = '<div style="margin-top:4px;"><img src="' + msg.file_url + '" style="max-width:180px;border-radius:8px;" alt="Изображение"></div>';
    }
  }
  container.insertAdjacentHTML('beforeend', '<div class="msg ' + (isMine ? 'mine' : 'other') + '">' + (isMine ? '' : '<div style="font-size:12px;font-weight:600;color:#5B6CFF;margin-bottom:2px;">' + (msg.full_name || msg.username) + '</div>') + (msg.content || '') + fileHtml + '<span class="time">' + new Date(msg.created_at).toLocaleTimeString() + '</span></div>');
  scrollToBottom();
}

function scrollToBottom() {
  const container = document.getElementById('chatMessages');
  setTimeout(() => container.scrollTop = container.scrollHeight, 50);
}

document.getElementById('messageInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
});

loadUserInfo();
connectSocket();
loadMessages();
</script>
</body>
</html>
