<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sklay — Чат</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0b0f;
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* ===== ШАПКА ===== */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #1a1a24;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      min-height: 60px;
      z-index: 10;
    }
    .back-btn {
      color: #f0f0f5;
      text-decoration: none;
      font-size: 22px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,0.05); }
    .chat-user {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .chat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(91,108,255,0.3), rgba(91,108,255,0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid rgba(91,108,255,0.15);
    }
    .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name {
      font-weight: 600;
      font-size: 17px;
      color: #f0f0f5;
      line-height: 1.2;
    }
    .chat-status {
      font-size: 13px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .chat-status .online { color: #4ade80; }
    .chat-status .offline { color: #666; }
    .chat-status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .chat-status .dot.online { background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,0.4); }
    .chat-status .dot.offline { background: #666; }

    /* ===== СООБЩЕНИЯ ===== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #0b0b0f;
      min-height: 0;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(91,108,255,0.3); border-radius: 10px; }

    .message {
      max-width: 78%;
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.5;
      word-wrap: break-word;
      animation: fadeIn 0.15s ease;
      margin-bottom: 2px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.mine {
      align-self: flex-end;
      background: #5B6CFF;
      border-bottom-right-radius: 4px;
      color: #fff;
    }
    .message.other {
      align-self: flex-start;
      background: #1e1e2a;
      border-bottom-left-radius: 4px;
      color: #f0f0f5;
    }
    .message .sender {
      font-size: 13px;
      font-weight: 600;
      color: #5B6CFF;
      margin-bottom: 2px;
    }
    .message .time {
      font-size: 11px;
      opacity: 0.5;
      margin-top: 4px;
      display: block;
      text-align: right;
    }
    .message .file {
      display: block;
      margin-top: 4px;
      max-width: 220px;
      border-radius: 12px;
      overflow: hidden;
    }
    .message .file img {
      width: 100%;
      border-radius: 12px;
      max-height: 300px;
      object-fit: cover;
      display: block;
    }
    .message .file video {
      width: 100%;
      border-radius: 12px;
      max-height: 300px;
      display: block;
    }

    .empty-chat {
      text-align: center;
      color: #666;
      padding: 60px 20px;
      margin: auto;
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.2; display: block; }
    .empty-text { font-size: 18px; font-weight: 500; color: #888; margin-bottom: 4px; }
    .empty-sub { font-size: 14px; color: #555; }

    .date-divider {
      text-align: center;
      font-size: 12px;
      color: #666;
      padding: 8px 0 12px;
    }
    .date-divider span {
      background: rgba(255,255,255,0.03);
      padding: 4px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      font-size: 12px;
      color: #888;
    }

    /* ===== ПАНЕЛЬ ВВОДА (всегда внизу) ===== */
    .chat-input-area {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 12px 12px;
      background: #1a1a24;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      min-height: 64px;
    }
    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: rgba(255,255,255,0.04);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 4px 4px 4px 16px;
      min-height: 44px;
    }
    .input-wrapper:focus-within {
      border-color: rgba(91,108,255,0.3);
      background: rgba(255,255,255,0.06);
    }
    .input-wrapper textarea {
      flex: 1;
      padding: 10px 4px 10px 0;
      background: transparent;
      border: none;
      color: #f0f0f5;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      resize: none;
      outline: none;
      min-height: 40px;
      max-height: 120px;
      line-height: 1.5;
      width: 100%;
    }
    .input-wrapper textarea::placeholder { color: #666; }

    .input-actions {
      display: flex;
      gap: 2px;
      align-items: center;
      flex-shrink: 0;
      padding-right: 4px;
    }
    .input-actions .btn {
      background: none;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .input-actions .btn:hover {
      background: rgba(255,255,255,0.05);
      color: #f0f0f5;
    }
    .input-actions .btn.attach:hover { color: #5B6CFF; }

    .send-btn {
      background: #5B6CFF;
      color: #fff;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(91,108,255,0.3);
    }
    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 20px rgba(91,108,255,0.4);
    }
    .send-btn:active { transform: scale(0.95); }
    .send-btn svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    #fileInput { display: none; }

    @media (max-width: 480px) {
      .message { max-width: 85%; font-size: 15px; padding: 8px 14px; }
      .chat-input-area { padding: 6px 10px 10px; min-height: 56px; }
      .input-wrapper { min-height: 38px; padding: 2px 2px 2px 12px; }
      .input-wrapper textarea { font-size: 15px; min-height: 32px; padding: 6px 4px; }
      .chat-header { padding: 10px 12px; min-height: 52px; }
      .chat-messages { padding: 12px 12px 6px; }
      .chat-avatar { width: 38px; height: 38px; font-size: 17px; }
      .send-btn { width: 42px; height: 42px; }
      .send-btn svg { width: 18px; height: 18px; }
      .chat-name { font-size: 15px; }
      .chat-status { font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="chat-container" style="display:flex;flex-direction:column;height:100vh;height:100dvh;">

  <!-- ШАПКА -->
  <div class="chat-header">
    <a href="/app" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <div class="chat-user">
      <div class="chat-avatar" id="chatAvatar">👤</div>
      <div class="chat-info">
        <div class="chat-name" id="chatTitle">{{ chat_name }}</div>
        <div class="chat-status">
          <span class="dot offline" id="statusDot"></span>
          <span id="chatStatus">Не в сети</span>
        </div>
      </div>
    </div>
  </div>

  <!-- СООБЩЕНИЯ -->
  <div class="chat-messages" id="chatMessages">
    <div id="messagesContainer"></div>
  </div>

  <!-- ПАНЕЛЬ ВВОДА -->
  <div class="chat-input-area" id="inputArea">
    <div class="input-wrapper">
      <textarea id="messageInput" rows="1" placeholder="Сообщение..." onkeydown="if(event.key==='Enter' &amp;&amp; !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <div class="input-actions">
        <button class="btn attach" onclick="document.getElementById('fileInput').click()" title="Прикрепить файл">
          <i class="fas fa-paperclip"></i>
        </button>
        <input type="file" id="fileInput" accept="image/*,video/*" onchange="uploadFile(this)">
      </div>
    </div>
    <button class="send-btn" onclick="sendMessage()" title="Отправить">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>

<script>
const chatId = {{ chat.id }};
const currentUserId = {{ session['user_id'] }};
let socket = null;

function loadUserInfo() {
  fetch('/api/chat_users/' + chatId)
    .then(res => res.json())
    .then(data => {
      if (data && data.username) {
        document.getElementById('chatTitle').textContent = data.full_name || data.username;
        const avatarEl = document.getElementById('chatAvatar');
        if (data.avatar && data.avatar.startsWith('/static/uploads/')) {
          avatarEl.innerHTML = '<img src="' + data.avatar + '" alt="Avatar">';
        } else {
          avatarEl.textContent = data.avatar || '👤';
        }
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('chatStatus');
        if (data.online) {
          statusDot.className = 'dot online';
          statusText.textContent = 'Онлайн';
        } else {
          statusDot.className = 'dot offline';
          statusText.textContent = 'Не в сети';
        }
      }
    })
    .catch(err => console.error('Ошибка загрузки пользователя:', err));
}

function connectSocket() {
  socket = io();
  socket.on('connect', () => {
    console.log('✅ WebSocket подключен');
    socket.emit('join_chat', { chat_id: chatId });
  });
  socket.on('new_message', (data) => {
    if (data.chat_id == chatId) addMessage(data);
  });
}

function loadMessages() {
  fetch('/api/messages/' + chatId)
    .then(res => res.json())
    .then(messages => {
      const container = document.getElementById('messagesContainer');
      if (!messages || messages.length === 0) {
        container.innerHTML = '<div class="empty-chat"><span class="empty-icon">💬</span><div class="empty-text">Нет сообщений</div><div class="empty-sub">Напишите первое сообщение</div></div>';
        return;
      }
      let lastDate = '';
      let html = '';
      messages.forEach(msg => {
        const msgDate = new Date(msg.created_at).toLocaleDateString('ru-RU');
        if (msgDate !== lastDate) {
          html += '<div class="date-divider"><span>' + msgDate + '</span></div>';
          lastDate = msgDate;
        }
        const isMine = msg.user_id == currentUserId;
        let fileHtml = '';
        if (msg.file_url) {
          if (msg.file_url.match(/\.(mp4|webm|ogg)$/i)) {
            fileHtml = '<div class="file"><video controls><source src="' + msg.file_url + '" type="video/mp4"></video></div>';
          } else {
            fileHtml = '<div class="file"><img src="' + msg.file_url + '" alt="Изображение" loading="lazy"></div>';
          }
        }
        html += '<div class="message ' + (isMine ? 'mine' : 'other') + '">' +
          (!isMine ? '<div class="sender">' + (msg.full_name || msg.username) + '</div>' : '') +
          (msg.content || '') + fileHtml +
          '<span class="time">' + new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '</span>' +
          '</div>';
      });
      container.innerHTML = html;
      scrollToBottom();
    })
    .catch(err => console.error('Ошибка загрузки сообщений:', err));
}

function sendMessage() {
  const input = document.getElementById('messageInput');
  const content = input.value.trim();
  if (!content) return;
  if (!socket) { alert('Нет соединения с сервером'); return; }
  socket.emit('send_message', { chat_id: chatId, content: content });
  input.value = '';
  input.style.height = 'auto';
}

function uploadFile(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 50 * 1024 * 1024) {
    alert('Файл слишком большой (макс. 50MB)');
    input.value = '';
    return;
  }
  const formData = new FormData();
  formData.append('media', file);
  fetch('/api/upload_media', {
    method: 'POST',
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if (data.url) {
      socket.emit('send_message', { chat_id: chatId, content: '', file_url: data.url });
    } else {
      alert('Ошибка загрузки файла');
    }
  })
  .catch(err => {
    console.error('Ошибка загрузки файла:', err);
    alert('Ошибка загрузки файла');
  });
  input.value = '';
}

function addMessage(msg) {
  const container = document.getElementById('messagesContainer');
  const empty = container.querySelector('.empty-chat');
  if (empty) container.innerHTML = '';
  const isMine = msg.user_id == currentUserId;
  let fileHtml = '';
  if (msg.file_url) {
    if (msg.file_url.match(/\.(mp4|webm|ogg)$/i)) {
      fileHtml = '<div class="file"><video controls><source src="' + msg.file_url + '" type="video/mp4"></video></div>';
    } else {
      fileHtml = '<div class="file"><img src="' + msg.file_url + '" alt="Изображение" loading="lazy"></div>';
    }
  }
  const div = document.createElement('div');
  div.className = 'message ' + (isMine ? 'mine' : 'other');
  div.innerHTML = (!isMine ? '<div class="sender">' + (msg.full_name || msg.username) + '</div>' : '') +
    (msg.content || '') + fileHtml +
    '<span class="time">' + new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '</span>';
  container.appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  const container = document.getElementById('chatMessages');
  setTimeout(() => container.scrollTop = container.scrollHeight, 50);
}

document.getElementById('messageInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
});

loadUserInfo();
connectSocket();
loadMessages();
</script>
</body>
</html>
