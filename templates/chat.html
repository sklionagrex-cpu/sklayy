<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0b0b0f; color:#fff; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; }
    #header { padding:12px 16px; background:#1a1a24; border-bottom:1px solid #333; }
    #messages { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; }
    #input-area { display:flex; padding:10px 12px; background:#1a1a24; border-top:1px solid #333; gap:8px; }
    #input-area input { flex:1; padding:10px 14px; border-radius:24px; border:1px solid #444; background:#0b0b0f; color:#fff; font-size:15px; outline:none; }
    #input-area button { background:#5B6CFF; border:none; border-radius:50%; width:44px; height:44px; color:#fff; font-size:20px; cursor:pointer; }
    .msg { padding:8px 14px; border-radius:16px; margin-bottom:4px; max-width:75%; word-wrap:break-word; }
    .mine { background:#5B6CFF; align-self:flex-end; border-bottom-right-radius:4px; }
    .other { background:#2a2a3a; align-self:flex-start; border-bottom-left-radius:4px; }
  </style>
</head>
<body>
<div id="header"><b>{{ chat_name }}</b></div>
<div id="messages"></div>
<div id="input-area">
  <input id="input" placeholder="Сообщение...">
  <button onclick="send()">➤</button>
</div>
<script>
const chatId = {{ chat.id }};
const socket = io();
socket.emit('join_chat', { chat_id: chatId });

socket.on('new_message', (data) => {
  const el = document.createElement('div');
  el.className = 'msg ' + (data.user_id == {{ session['user_id'] }} ? 'mine' : 'other');
  el.textContent = data.content || '📎';
  document.getElementById('messages').appendChild(el);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
});

function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  socket.emit('send_message', { chat_id: chatId, content: text });
  input.value = '';
}

document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
});

// Загружаем старые сообщения
fetch('/api/messages/' + chatId)
  .then(r => r.json())
  .then(messages => {
    const container = document.getElementById('messages');
    messages.forEach(msg => {
      const el = document.createElement('div');
      el.className = 'msg ' + (msg.user_id == {{ session['user_id'] }} ? 'mine' : 'other');
      el.textContent = msg.content || '📎';
      container.appendChild(el);
    });
    container.scrollTop = container.scrollHeight;
  });
</script>
</body>
</html>
