<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sklay — Чат</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
<div style="display:flex;flex-direction:column;height:100vh;background:#0b0b0f;color:#fff;font-family:'Inter',sans-serif;max-width:100%;margin:0;padding:0;">

  <!-- ШАПКА -->
  <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;">
    <a href="/app" style="color:#fff;text-decoration:none;font-size:20px;padding:4px 8px;">←</a>
    <div style="display:flex;align-items:center;gap:10px;flex:1;">
      <div style="width:40px;height:40px;border-radius:50%;background:rgba(91,108,255,0.15);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0;" id="chatAvatar">👤</div>
      <div>
        <div style="font-weight:600;font-size:16px;" id="chatTitle">{{ chat_name }}</div>
        <div style="font-size:12px;color:#888;" id="chatStatus">Не в сети</div>
      </div>
    </div>
  </div>

  <!-- СООБЩЕНИЯ -->
  <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;background: radial-gradient(ellipse at 30% 20%, rgba(91,108,255,0.03) 0%, transparent 70%);" id="chatMessages">
    <div id="messagesContainer">
      <div style="text-align:center;color:#666;padding:40px 20px;">
        <div style="font-size:40px;margin-bottom:12px;opacity:0.2;">💬</div>
        <div style="font-size:18px;color:#888;">Нет сообщений</div>
        <div style="font-size:14px;color:#555;margin-top:4px;">Напишите первое сообщение</div>
      </div>
    </div>
  </div>

  <!-- ПАНЕЛЬ ВВОДА -->
  <div style="display:flex;gap:10px;padding:10px 16px 16px 16px;background:rgba(255,255,255,0.02);border-top:1px solid rgba(255,255,255,0.06);flex-shrink:0;align-items:flex-end;">
    <div style="flex:1;display:flex;align-items:flex-end;background:rgba(255,255,255,0.04);border-radius:24px;border:1px solid rgba(255,255,255,0.06);padding:4px 6px 4px 16px;transition:border 0.2s;">
      <textarea id="messageInput" rows="1" placeholder="Сообщение..." style="flex:1;padding:10px 4px 10px 0;background:transparent;border:none;color:#fff;font-family:'Inter',sans-serif;font-size:15px;resize:none;outline:none;min-height:40px;max-height:120px;line-height:1.5;"></textarea>
      <button onclick="document.getElementById('fileInput').click()" style="background:none;border:none;color:#888;font-size:20px;cursor:pointer;padding:6px;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;transition:0.2s;">📎</button>
      <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="uploadFile(this)">
    </div>
    <button onclick="sendMessage()" style="background:#5B6CFF;color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 12px rgba(91,108,255,0.3);transition:0.2s;">✈️</button>
  </div>
</div>

<script>
const chatId = {{ chat.id }};
const currentUserId = {{ session['user_id'] }};
let socket = null;

function loadUserInfo() {
  fetch('/api/chat_users/' + chatId)
    .then(res => res.json())
    .then(data => {
      if (data && data.username) {
        document.getElementById('chatTitle').textContent = data.full_name || data.username;
        const avatarEl = document.getElementById('chatAvatar');
        if (data.avatar && data.avatar.startsWith('/static/uploads/')) {
          avatarEl.innerHTML = '<img src="' + data.avatar + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
        } else {
          avatarEl.textContent = data.avatar || '👤';
        }
        document.getElementById('chatStatus').textContent = data.online ? '🟢 Онлайн' : '⚪ Не в сети';
      }
    })
    .catch(err => console.error('Ошибка загрузки пользователя:', err));
}

function connectSocket() {
  socket = io();
  socket.on('connect', () => {
    console.log('WebSocket подключен');
    socket.emit('join_chat', { chat_id: chatId });
  });
  socket.on('new_message', (data) => {
    if (data.chat_id == chatId) addMessage(data);
  });
  socket.on('disconnect', () => {
    console.log('WebSocket отключен');
  });
}

function loadMessages() {
  fetch('/api/messages/' + chatId)
    .then(res => res.json())
    .then(messages => {
      const container = document.getElementById('messagesContainer');
      if (!messages || messages.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#666;padding:40px 20px;"><div style="font-size:40px;margin-bottom:12px;opacity:0.2;">💬</div><div style="font-size:18px;color:#888;">Нет сообщений</div><div style="font-size:14px;color:#555;margin-top:4px;">Напишите первое сообщение</div></div>';
        return;
      }
      let html = '';
      let lastDate = '';
      messages.forEach(msg => {
        const msgDate = new Date(msg.created_at).toLocaleDateString('ru-RU');
        if (msgDate !== lastDate) {
          html += '<div style="text-align:center;font-size:12px;color:#666;padding:8px 0 12px 0;"><span style="background:rgba(255,255,255,0.03);padding:4px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.04);font-size:12px;color:#888;">' + msgDate + '</span></div>';
          lastDate = msgDate;
        }
        const isMine = msg.user_id == currentUserId;
        let fileHtml = '';
        if (msg.file_url) {
          if (msg.file_url.match(/\.(mp4|webm|ogg)$/i)) {
            fileHtml = '<div style="margin-top:4px;max-width:200px;border-radius:12px;overflow:hidden;"><video controls style="width:100%;border-radius:12px;max-height:300px;display:block;"><source src="' + msg.file_url + '" type="video/mp4"></video></div>';
          } else {
            fileHtml = '<div style="margin-top:4px;max-width:200px;border-radius:12px;overflow:hidden;"><img src="' + msg.file_url + '" style="width:100%;border-radius:12px;max-height:300px;object-fit:cover;display:block;"></div>';
          }
        }
        html += '<div style="max-width:75%;padding:8px 16px;border-radius:18px;font-size:15px;line-height:1.5;word-wrap:break-word;animation:fadeIn 0.15s ease;margin-bottom:2px;' + (isMine ? 'align-self:flex-end;background:#5B6CFF;border-bottom-right-radius:4px;color:#fff;' : 'align-self:flex-start;background:rgba(255,255,255,0.06);border-bottom-left-radius:4px;') + '">' +
          (!isMine ? '<div style="font-size:12px;font-weight:600;color:#5B6CFF;margin-bottom:2px;">' + (msg.full_name || msg.username) + ' <span style="font-weight:400;color:#888;font-size:10px;">' + new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '</span></div>' : '') +
          (msg.content || '') + fileHtml +
          (isMine ? '<span style="font-size:10px;opacity:0.5;margin-top:4px;display:block;text-align:right;">' + new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '</span>' : '') +
          '</div>';
      });
      container.innerHTML = html;
      scrollToBottom();
    })
    .catch(err => console.error('Ошибка загрузки сообщений:', err));
}

function sendMessage() {
  const input = document.getElementById('messageInput');
  const content = input.value.trim();
  if (!content) return;
  socket.emit('send_message', { chat_id: chatId, content: content });
  input.value = '';
  input.style.height = 'auto';
}

function uploadFile(input) {
  const file = input.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('media', file);
  fetch('/api/upload_media', {
    method: 'POST',
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if (data.url) {
      socket.emit('send_message', { chat_id: chatId, content: '', file_url: data.url });
    }
  })
  .catch(err => console.error('Ошибка загрузки файла:', err));
  input.value = '';
}

function addMessage(msg) {
  const container = document.getElementById('messagesContainer');
  const empty = container.querySelector('div[style*="text-align:center;color:#666;padding:40px 20px;"]');
  if (empty) container.innerHTML = '';
  const isMine = msg.user_id == currentUserId;
  let fileHtml = '';
  if (msg.file_url) {
    if (msg.file_url.match(/\.(mp4|webm|ogg)$/i)) {
      fileHtml = '<div style="margin-top:4px;max-width:200px;border-radius:12px;overflow:hidden;"><video controls style="width:100%;border-radius:12px;max-height:300px;display:block;"><source src="' + msg.file_url + '" type="video/mp4"></video></div>';
    } else {
      fileHtml = '<div style="margin-top:4px;max-width:200px;border-radius:12px;overflow:hidden;"><img src="' + msg.file_url + '" style="width:100%;border-radius:12px;max-height:300px;object-fit:cover;display:block;"></div>';
    }
  }
  container.insertAdjacentHTML('beforeend', '<div style="max-width:75%;padding:8px 16px;border-radius:18px;font-size:15px;line-height:1.5;word-wrap:break-word;animation:fadeIn 0.15s ease;margin-bottom:2px;' + (isMine ? 'align-self:flex-end;background:#5B6CFF;border-bottom-right-radius:4px;color:#fff;' : 'align-self:flex-start;background:rgba(255,255,255,0.06);border-bottom-left-radius:4px;') + '">' +
    (!isMine ? '<div style="font-size:12px;font-weight:600;color:#5B6CFF;margin-bottom:2px;">' + (msg.full_name || msg.username) + ' <span style="font-weight:400;color:#888;font-size:10px;">' + new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '</span></div>' : '') +
    (msg.content || '') + fileHtml +
    (isMine ? '<span style="font-size:10px;opacity:0.5;margin-top:4px;display:block;text-align:right;">' + new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '</span>' : '') +
    '</div>');
  scrollToBottom();
}

function scrollToBottom() {
  const container = document.getElementById('chatMessages');
  setTimeout(() => container.scrollTop = container.scrollHeight, 50);
}

document.getElementById('messageInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
});

loadUserInfo();
connectSocket();
loadMessages();
</script>
</body>
</html>
