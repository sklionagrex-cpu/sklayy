<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sklay - Edit Profile</title>
  <link rel="stylesheet" href="/static/css/profile.css">
  <link rel="stylesheet" href="/static/css/edit_profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
<div class="edit-container">
  <a href="/app" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
  <div class="edit-card">
    <div class="avatar-section">
      <div class="avatar-circle" id="avatarDisplay">
        {% if user.avatar and user.avatar.startswith("/static/uploads/") %}
          <img src="{{ user.avatar }}" alt="Avatar">
        {% else %}
          {{ user.avatar or "👤" }}
        {% endif %}
      </div>
      <button class="avatar-edit" onclick="document.getElementById("avatarInput").click()"><i class="fas fa-camera"></i></button>
      <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
    </div>
    <div class="edit-group">
      <div class="edit-row"><label>Full name</label><input type="text" id="edit-full_name" value="{{ user.full_name or "" }}"></div>
      <div class="edit-row"><label>Status</label><input type="text" id="edit-status" value="{{ user.status or "" }}" placeholder="Enter your status..."></div>
      <div class="edit-row"><label>About</label><textarea id="edit-bio" rows="3">{{ user.bio or "" }}</textarea></div>
      <div class="edit-row"><label>Email</label><input type="email" id="edit-email" value="{{ user.email or "" }}"></div>
      <div class="edit-row"><label>Phone</label><input type="tel" id="edit-phone" value="{{ user.phone or "" }}"></div>
      <div class="edit-buttons">
        <button class="btn-primary" onclick="saveProfile()"><i class="fas fa-save"></i> Save</button>
        <a href="/app" class="btn-secondary">Cancel</a>
      </div>
    </div>
  </div>
</div>
<script>
function uploadAvatar(input) {
  const file = input.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("avatar", file);
  fetch("/api/upload_avatar", {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if (data.url) {
      document.getElementById("avatarDisplay").innerHTML = "<img src=\\"" + data.url + "?t=" + Date.now() + "\\" alt=\\"Avatar\\">";
      alert("Avatar updated!");
    }
  })
  .catch(err => alert("Upload error: " + err));
}

function saveProfile() {
  const data = {
    full_name: document.getElementById("edit-full_name").value,
    status: document.getElementById("edit-status").value,
    bio: document.getElementById("edit-bio").value,
    email: document.getElementById("edit-email").value,
    phone: document.getElementById("edit-phone").value
  };
  fetch("/api/profile", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(() => {
    alert("Profile updated!");
    window.location.href = "/app";
  })
  .catch(err => alert("Update error: " + err));
}
</script>
</body>
</html>
