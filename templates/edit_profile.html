<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sklay - Edit Profile</title>
  <link rel="stylesheet" href="/static/css/profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    body { background: #0b0b0f; color: #f0f0f5; font-family: 'Inter', sans-serif; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    .back { color: #f0f0f5; font-size: 24px; text-decoration: none; display: inline-block; margin-bottom: 20px; }
    .card { background: rgba(255,255,255,0.03); border-radius: 24px; padding: 24px; border: 1px solid rgba(255,255,255,0.06); }
    .avatar-wrap { text-align: center; margin-bottom: 20px; }
    .avatar { width: 100px; height: 100px; border-radius: 50%; background: rgba(91,108,255,0.15); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 50px; overflow: hidden; border: 3px solid rgba(91,108,255,0.2); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-btn { background: #5B6CFF; border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px; box-shadow: 0 0 20px rgba(91,108,255,0.3); transition: all 0.3s; }
    .avatar-btn:hover { transform: scale(1.1); }
    .field { margin-bottom: 16px; }
    .field label { display: block; color: #888; font-size: 13px; margin-bottom: 4px; font-weight: 500; }
    .field input, .field textarea { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #f0f0f5; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; transition: all 0.3s; box-sizing: border-box; }
    .field input:focus, .field textarea:focus { border-color: #5B6CFF; background: rgba(255,255,255,0.08); }
    .field textarea { resize: vertical; min-height: 80px; }
    .actions { display: flex; gap: 12px; margin-top: 20px; }
    .actions .btn-primary, .actions .btn-secondary { flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 15px; border: none; cursor: pointer; font-family: 'Inter', sans-serif; text-align: center; transition: all 0.3s; text-decoration: none; }
    .actions .btn-primary { background: #5B6CFF; color: #fff; }
    .actions .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(91,108,255,0.3); }
    .actions .btn-secondary { background: rgba(255,255,255,0.05); color: #f0f0f5; display: flex; align-items: center; justify-content: center; }
    .actions .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    #avatarInput { display: none; }
  </style>
</head>
<body>
<div class="container">
  <a href="/app" class="back"><i class="fas fa-arrow-left"></i> Назад</a>
  <div class="card">
    <div class="avatar-wrap">
      <div class="avatar" id="avatarDisplay">
        {% if user.avatar and user.avatar.startswith('/static/uploads/') %}
          <img src="{{ user.avatar }}" alt="Avatar">
        {% else %}
          {{ user.avatar or '👤' }}
        {% endif %}
      </div>
      <button class="avatar-btn" onclick="document.getElementById('avatarInput').click()"><i class="fas fa-camera"></i></button>
      <input type="file" id="avatarInput" accept="image/*" onchange="uploadAvatar(this)">
    </div>

    <div class="field">
      <label>Полное имя</label>
      <input type="text" id="edit-full_name" value="{{ user.full_name or '' }}">
    </div>
    <div class="field">
      <label>Статус</label>
      <input type="text" id="edit-status" value="{{ user.status or '' }}" placeholder="Введите ваш статус...">
    </div>
    <div class="field">
      <label>О себе</label>
      <textarea id="edit-bio" rows="3">{{ user.bio or '' }}</textarea>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="edit-email" value="{{ user.email or '' }}">
    </div>
    <div class="field">
      <label>Телефон</label>
      <input type="tel" id="edit-phone" value="{{ user.phone or '' }}">
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="saveProfile()"><i class="fas fa-save"></i> Сохранить</button>
      <a href="/app" class="btn-secondary">Отмена</a>
    </div>
  </div>
</div>

<script>
function uploadAvatar(input) {
  const file = input.files[0];
  if (!file) {
    alert('Файл не выбран');
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    alert('Файл слишком большой (макс. 5MB)');
    input.value = '';
    return;
  }

  if (!file.type.startsWith('image/')) {
    alert('Можно загружать только изображения');
    input.value = '';
    return;
  }

  const formData = new FormData();
  formData.append('avatar', file);

  fetch('/api/upload_avatar', {
    method: 'POST',
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if (data.url) {
      const avatarDisplay = document.getElementById('avatarDisplay');
      avatarDisplay.innerHTML = `<img src="${data.url}?t=${Date.now()}" alt="Avatar">`;
      alert('✅ Аватар обновлён!');
    } else {
      alert('❌ Ошибка: ' + (data.error || 'Неизвестная ошибка'));
    }
  })
  .catch(err => {
    alert('❌ Ошибка загрузки: ' + err);
  });

  input.value = '';
}

function saveProfile() {
  const data = {
    full_name: document.getElementById('edit-full_name').value,
    status: document.getElementById('edit-status').value,
    bio: document.getElementById('edit-bio').value,
    email: document.getElementById('edit-email').value,
    phone: document.getElementById('edit-phone').value
  };

  fetch('/api/profile', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(() => {
    alert('✅ Профиль обновлён!');
    window.location.href = '/app';
  })
  .catch(err => {
    alert('❌ Ошибка обновления: ' + err);
  });
}
</script>
</body>
</html>
