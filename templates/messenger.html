<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sklay — Мессенджер</title>
  <link rel="stylesheet" href="/static/css/messenger.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
  <div id="splash" class="splash-active">
    <div class="splash-logo">◈ Sklay</div>
    <div class="splash-message" id="splashMessage">Загружаем...</div>
  </div>

  <div id="app" class="app-hidden">
    <div class="panels-container">
      <!-- ЛЕНТА (новый дизайн) -->
      <div class="panel panel-feed active" id="panel-feed">
        <div class="panel-header"><h2>Лента</h2></div>
        <div class="panel-content" id="feedList"></div>
      </div>

      <!-- ЧАТЫ -->
      <div class="panel panel-chats" id="panel-chats">
        <div class="panel-header">
          <h2>Чаты</h2>
          <div class="panel-actions">
            <input type="text" placeholder="Поиск..." class="search-input" id="chatSearch">
            <button class="btn-icon" onclick="createChat()">➕</button>
            <button class="btn-icon" onclick="createGroup()" title="Создать группу"><i class="fas fa-user-plus"></i></button>
          </div>
        </div>
        <div class="panel-content" id="chatList">
          <div class="empty-state"><div class="empty-icon">💬</div><div class="empty-title">Нет чатов</div><div class="empty-text">Начните общение — напишите кому-нибудь первым</div></div>
        </div>
      </div>

      <!-- СООБЩЕСТВА -->
