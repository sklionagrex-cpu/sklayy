<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sklay — Пост</title>
  <link rel="stylesheet" href="/static/css/profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    body { padding: 12px; padding-bottom: 100px; background: #0b0b0f; color: #f0f0f5; font-family: 'Inter', sans-serif; margin: 0; }
    .back-btn { color: #f0f0f5; text-decoration: none; font-size: 24px; display: inline-block; margin-bottom: 16px; }
    .post-card { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 16px; }
    .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .post-avatar { width: 44px; height: 44px; border-radius: 50%; background: rgba(91,108,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; flex-shrink: 0; }
    .post-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .post-author { font-weight: 600; font-size: 16px; color: #f0f0f5; }
    .post-username { color: #888; font-size: 13px; }
    .post-date { color: #666; font-size: 12px; margin-left: auto; }
    .post-content { font-size: 16px; line-height: 1.6; margin: 8px 0 12px 0; }
    .post-media { border-radius: 12px; overflow: hidden; margin: 8px 0; }
    .post-media img, .post-media video { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; }
    .post-actions { display: flex; gap: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.04); }
    .post-actions button { background: none; border: none; color: #888; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .comments-section { margin-top: 16px; padding-bottom: 80px; }
    .comments-section h3 { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: #f0f0f5; }
    .comment-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(91,108,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; flex-shrink: 0; }
    .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .comment-body { flex: 1; }
    .comment-author { font-weight: 600; font-size: 14px; color: #5B6CFF; }
    .comment-text { font-size: 15px; margin: 4px 0; color: #f0f0f5; }
    .comment-media { border-radius: 8px; overflow: hidden; margin: 4px 0; }
    .comment-media img, .comment-media video { max-width: 100%; max-height: 200px; border-radius: 8px; }
    .comment-time { font-size: 12px; color: #666; }
    .comment-delete { background: none; border: none; color: #888; cursor: pointer; padding: 4px; }
    .comment-input-area { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: rgba(11,11,15,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); z-index: 100; }
    .comment-input-wrapper { display: flex; gap: 10px; align-items: flex-end; }
    .comment-input-wrapper textarea { flex: 1; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #f0f0f5; font-family: 'Inter', sans-serif; font-size: 15px; resize: none; outline: none; min-height: 40px; max-height: 120px; }
    .comment-input-wrapper textarea:focus { border-color: #5B6CFF; background: rgba(255,255,255,0.08); }
    .send-btn { background: #5B6CFF; border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: all 0.3s; flex-shrink: 0; box-shadow: 0 0 20px rgba(91,108,255,0.2); }
    .send-btn:hover { transform: scale(1.05); }
    .empty-state { text-align: center; color: #888; padding: 20px; }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
    .empty-title { font-size: 18px; font-weight: 500; color: #888; }
    .empty-text { font-size: 14px; color: #666; margin-top: 4px; }
    @media (max-width: 480px) {
      body { padding: 8px; padding-bottom: 80px; }
      .post-card { padding: 12px; }
      .post-avatar { width: 36px; height: 36px; font-size: 18px; }
      .post-content { font-size: 15px; }
      .comment-item { padding: 10px 0; }
      .comment-avatar { width: 30px; height: 30px; font-size: 16px; }
      .comment-input-area { padding: 8px 12px; }
      .comment-input-wrapper textarea { font-size: 14px; padding: 8px 12px; }
      .send-btn { width: 40px; height: 40px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <a href="/app" class="back-btn"><i class="fas fa-arrow-left"></i></a>
  <div id="postContent"></div>
  <div class="comments-section">
    <h3>💬 Комментарии</h3>
    <div id="commentsList"><div class="empty-state"><div class="empty-icon">💬</div><div class="empty-title">Нет комментариев</div><div class="empty-text">Будьте первым!</div></div></div>
  </div>
  <div class="comment-input-area">
    <div class="comment-input-wrapper">
      <textarea id="commentContent" placeholder="Написать комментарий..." rows="1"></textarea>
      <button class="send-btn" onclick="sendComment()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
  <script>
    const postId = {{ post_id }};
    const currentUserId = {{ session['user_id'] }};
    function loadPost() {
      fetch('/api/feed')
        .then(res => res.json())
        .then(posts => {
          const post = posts.find(p => p.id === postId);
          if (!post) { document.getElementById('postContent').innerHTML = '<div class="empty-state">Пост не найден</div>'; return; }
          const avatarHtml = post.avatar && post.avatar.startsWith('/static/uploads/')
            ? `<img src="${post.avatar}" alt="Avatar">`
            : (post.avatar || '👤');
          const mediaHtml = post.media_url
            ? (post.media_url.match(/\.(mp4|webm|ogg)$/i)
              ? `<div class="post-media"><video controls><source src="${post.media_url}" type="video/mp4"></video></div>`
              : `<div class="post-media"><img src="${post.media_url}" alt="Изображение"></div>`)
            : '';
          document.getElementById('postContent').innerHTML = `
            <div class="post-card">
              <div class="post-header">
                <div class="post-avatar">${avatarHtml}</div>
                <div>
                  <div class="post-author">${post.full_name || post.username}</div>
                  <div class="post-username">@${post.username}</div>
                </div>
                <div class="post-date">${post.created_at ? post.created_at.slice(0,10) : ''}</div>
              </div>
              <div class="post-content">${post.content}</div>
              ${mediaHtml}
              <div class="post-actions">
                <button onclick="likePost(${post.id})">❤️ ${post.likes || 0}</button>
              </div>
            </div>
          `;
        })
        .catch(err => console.error('Ошибка загрузки поста:', err));
    }
    function likePost(postId) {
      fetch(`/api/posts/${postId}/like`, { method: 'POST' })
        .then(res => res.json())
        .then(data => { if (data.success) loadPost(); })
        .catch(err => console.error('Ошибка:', err));
    }
    function loadComments() {
      fetch(`/api/posts/${postId}/comments`)
        .then(res => res.json())
        .then(comments => {
          const container = document.getElementById('commentsList');
          if (!comments || comments.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-title">Нет комментариев</div><div class="empty-text">Будьте первым!</div></div>';
            return;
          }
          container.innerHTML = comments.map(c => {
            const avatarHtml = c.avatar && c.avatar.startsWith('/static/uploads/')
              ? `<img src="${c.avatar}" alt="Avatar">`
              : (c.avatar || '👤');
            const mediaHtml = c.media_url
              ? (c.media_url.match(/\.(mp4|webm|ogg)$/i)
                ? `<div class="comment-media"><video controls><source src="${c.media_url}" type="video/mp4"></video></div>`
                : `<div class="comment-media"><img src="${c.media_url}" alt="Изображение"></div>`)
              : '';
            return `
              <div class="comment-item">
                <div class="comment-avatar">${avatarHtml}</div>
                <div class="comment-body">
                  <div class="comment-author">${c.full_name || c.username}</div>
                  <div class="comment-text">${c.content}</div>
                  ${mediaHtml}
                  <div class="comment-time">${new Date(c.created_at).toLocaleString()}</div>
                </div>
                ${c.user_id == currentUserId ? `<button class="comment-delete" onclick="deleteComment(${c.id})"><i class="fas fa-trash"></i></button>` : ''}
              </div>
            `;
          }).join('');
        })
        .catch(err => console.error('Ошибка загрузки комментариев:', err));
    }
    function sendComment() {
      const input = document.getElementById('commentContent');
      const content = input.value.trim();
      if (!content) { alert('Введите текст'); return; }
      fetch(`/api/posts/${postId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: content })
      })
      .then(res => res.json())
      .then(() => {
        input.value = '';
        input.style.height = 'auto';
        loadComments();
        // Прокрутка вниз после отправки
        setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 100);
      })
      .catch(err => console.error('Ошибка отправки:', err));
    }
    function deleteComment(commentId) {
      if (!confirm('Удалить комментарий?')) return;
      fetch(`/api/comments/${commentId}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(data => { if (data.success) loadComments(); })
        .catch(err => console.error('Ошибка удаления:', err));
    }
    document.addEventListener('DOMContentLoaded', () => {
      loadPost();
      loadComments();
      document.getElementById('commentContent').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
      });
      // Прокрутка к последнему комментарию при загрузке
      setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 300);
    });
  </script>
</body>
</html>
