<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пост</title>
  <link rel="stylesheet" href="/static/css/profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
  <div class="profile-container">
    <div class="profile-header-fixed">
      <div class="profile-top">
        <a href="/app" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <span class="profile-title">Пост</span>
      </div>
    </div>

    <div id="postContent" class="post-detail"></div>

    <div class="comments-section">
      <h3>Комментарии</h3>
      <div id="commentsList" class="comments-list">
        <div class="empty-state">Загрузка комментариев...</div>
      </div>
    </div>

    <div class="comment-input-area">
      <div class="comment-input-wrapper">
        <textarea id="commentContent" placeholder="Написать комментарий..." rows="2"></textarea>
        <button class="send-btn" onclick="sendComment()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script>
    const postId = {{ post_id }};
    let mediaUrl = null;

    function loadPost() {
      fetch('/api/posts')
        .then(res => res.json())
        .then(posts => {
          const post = posts.find(p => p.id === postId);
          if (!post) {
            document.getElementById('postContent').innerHTML = '<div class="empty-state">Пост не найден</div>';
            return;
          }
          let mediaHtml = '';
          if (post.media_url) {
            if (post.media_url.match(/\.(mp4|webm|ogg)$/i)) {
              mediaHtml = `<video controls style="max-width:100%;max-height:400px;border-radius:12px;margin-top:8px;"><source src="${post.media_url}" type="video/mp4"></video>`;
            } else {
              mediaHtml = `<img src="${post.media_url}" style="max-width:100%;max-height:400px;border-radius:12px;margin-top:8px;" alt="Изображение">`;
            }
          }
          document.getElementById('postContent').innerHTML = `
            <div class="post-item">
              <div class="post-header">
                <span class="post-author">${post.full_name || post.username}</span>
                <span class="post-date">${post.created_at ? post.created_at.slice(0,10) : ''}</span>
              </div>
              <div class="post-content">${post.content}</div>
              ${mediaHtml}
              <div class="post-actions">
                <button class="btn-sm" onclick="likePost(${post.id})">❤️ ${post.likes || 0}</button>
              </div>
            </div>
          `;
        })
        .catch(err => console.error('Ошибка загрузки поста:', err));
    }

    function likePost(postId) {
      fetch(`/api/posts/${postId}/like`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
          if (data.success) loadPost();
        })
        .catch(err => console.error('Ошибка:', err));
    }

    function loadComments() {
      fetch(`/api/posts/${postId}/comments`)
        .then(res => res.json())
        .then(comments => {
          const container = document.getElementById('commentsList');
          if (!comments || comments.length === 0) {
            container.innerHTML = '<div class="empty-state">Нет комментариев. Будьте первым!</div>';
            return;
          }
          container.innerHTML = comments.map(c => {
            let mediaHtml = '';
            if (c.media_url) {
              if (c.media_url.match(/\.(mp4|webm|ogg)$/i)) {
                mediaHtml = `<video controls style="max-width:100%;max-height:200px;border-radius:8px;margin-top:4px;"><source src="${c.media_url}" type="video/mp4"></video>`;
              } else {
                mediaHtml = `<img src="${c.media_url}" style="max-width:100%;max-height:200px;border-radius:8px;margin-top:4px;" alt="Изображение">`;
              }
            }
            return `
              <div class="comment-item">
                <div class="comment-avatar">${c.avatar || '👤'}</div>
                <div class="comment-body">
                  <div class="comment-author">${c.full_name || c.username}</div>
                  <div class="comment-text">${c.content}</div>
                  ${mediaHtml}
                  <div class="comment-time">${new Date(c.created_at).toLocaleString()}</div>
                </div>
                <button class="comment-delete" onclick="deleteComment(${c.id})" style="background:none;border:none;color:#888;cursor:pointer;"><i class="fas fa-trash"></i></button>
              </div>
            `;
          }).join('');
        })
        .catch(err => console.error('Ошибка загрузки комментариев:', err));
    }

    function sendComment() {
      const content = document.getElementById('commentContent').value.trim();
      if (!content && !mediaUrl) {
        alert('Введите текст или прикрепите медиа');
        return;
      }
      const data = { content: content };
      if (mediaUrl) data.media_url = mediaUrl;
      fetch(`/api/posts/${postId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById('commentContent').value = '';
        mediaUrl = null;
        loadComments();
      })
      .catch(err => console.error('Ошибка отправки:', err));
    }

    function deleteComment(commentId) {
      if (!confirm('Удалить комментарий?')) return;
      fetch(`/api/comments/${commentId}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(data => {
          if (data.success) loadComments();
        })
        .catch(err => console.error('Ошибка удаления:', err));
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPost();
      loadComments();
    });
  </script>
</body>
</html>
