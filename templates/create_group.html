<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sklay — Создать группу</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0b0f;
      color: #f0f0f5;
      min-height: 100vh;
      padding: 16px;
    }
    .back-btn {
      color: #f0f0f5;
      text-decoration: none;
      font-size: 24px;
      display: inline-block;
      margin-bottom: 16px;
    }
    .back-btn:hover { color: #5B6CFF; }
    .page-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      color: #888;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      color: #f0f0f5;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.3s;
    }
    .form-group input:focus {
      border-color: #5B6CFF;
      background: rgba(255,255,255,0.08);
    }
    .selected-members {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
      min-height: 40px;
    }
    .member-chip {
      background: rgba(91,108,255,0.15);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(91,108,255,0.2);
    }
    .member-chip .remove {
      background: none;
      border: none;
      color: #ff6b6b;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
    }
    .add-btn {
      background: rgba(255,255,255,0.05);
      border: 1px dashed rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 6px 16px;
      color: #888;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .add-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #f0f0f5;
    }
    .btn-create {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #5B6CFF;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      margin-top: 16px;
    }
    .btn-create:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(91,108,255,0.3);
    }
    .btn-create:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-window {
      background: #1a1a24;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h3 {
      font-size: 18px;
      font-weight: 600;
    }
    .modal-close {
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
    }
    .modal-close:hover { color: #f0f0f5; }
    .modal-search {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.04);
      color: #f0f0f5;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
      font-family: 'Inter', sans-serif;
    }
    .modal-search:focus { border-color: #5B6CFF; }
    .modal-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .modal-list .friend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      transition: background 0.2s;
      cursor: default;
    }
    .modal-list .friend-item:hover {
      background: rgba(255,255,255,0.04);
    }
    .modal-list .friend-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(91,108,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .modal-list .friend-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .modal-list .friend-info { flex: 1; }
    .modal-list .friend-name {
      font-weight: 500;
      font-size: 15px;
    }
    .modal-list .friend-username {
      font-size: 12px;
      color: #888;
    }
    .modal-list .friend-add {
      background: #5B6CFF;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .modal-list .friend-add:hover {
      transform: scale(1.1);
    }
    .modal-list .friend-add.added {
      background: #ff6b6b;
    }
    .modal-footer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.04);
      display: flex;
      justify-content: flex-end;
    }
    .modal-footer .done-btn {
      padding: 8px 24px;
      border: none;
      border-radius: 10px;
      background: #5B6CFF;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .modal-footer .done-btn:hover {
      opacity: 0.9;
    }
    .empty-state {
      text-align: center;
      color: #666;
      padding: 30px 20px;
    }
  </style>
</head>
<body>

<a href="/app" class="back-btn"><i class="fas fa-arrow-left"></i> Назад</a>
<h1 class="page-title">👥 Создать группу</h1>

<div class="form-group">
  <label>Название группы</label>
  <input type="text" id="groupNameInput" placeholder="Введите название...">
</div>

<div class="form-group">
  <label>Участники</label>
  <div class="selected-members" id="selectedMembers">
    <button class="add-btn" onclick="openAddMembers()">
      <i class="fas fa-plus"></i> Добавить участников
    </button>
  </div>
</div>

<button class="btn-create" id="createGroupBtn" disabled>Создать группу</button>

<div class="modal-overlay" id="membersModal">
  <div class="modal-window">
    <div class="modal-header">
      <h3>Выбрать участников</h3>
      <button class="modal-close" onclick="closeAddMembers()">✕</button>
    </div>
    <input class="modal-search" id="memberSearch" placeholder="Поиск..." oninput="filterFriends(this.value)">
    <div class="modal-list" id="modalFriendsList">
      <div class="empty-state">⏳ Загрузка...</div>
    </div>
    <div class="modal-footer">
      <button class="done-btn" onclick="closeAddMembers()">Готово</button>
    </div>
  </div>
</div>

<script>
let selectedMembers = [];
let allFriends = [];

function loadFriends() {
  const container = document.getElementById('modalFriendsList');
  container.innerHTML = '<div class="empty-state">⏳ Загрузка...</div>';
  
  fetch('/api/friends')
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(friends => {
      allFriends = friends || [];
      renderFriendList();
    })
    .catch(err => {
      console.error('❌ Ошибка загрузки друзей:', err);
      container.innerHTML = '<div class="empty-state">❌ Ошибка загрузки</div>';
    });
}

function renderFriendList(filter = '') {
  const container = document.getElementById('modalFriendsList');
  const filtered = allFriends.filter(f => {
    const name = (f.full_name || f.username || '').toLowerCase();
    const username = (f.username || '').toLowerCase();
    const q = filter.toLowerCase();
    return name.includes(q) || username.includes(q);
  });
  
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state">Нет друзей</div>';
    return;
  }
  
  container.innerHTML = filtered.map(f => {
    const isAdded = selectedMembers.some(m => m.id === f.id);
    const avatarHtml = f.avatar && f.avatar.startsWith('/static/uploads/')
      ? `<img src="${f.avatar}" alt="Avatar">`
      : (f.avatar || '👤');
    return `
      <div class="friend-item">
        <div class="friend-avatar">${avatarHtml}</div>
        <div class="friend-info">
          <div class="friend-name">${f.full_name || f.username}</div>
          <div class="friend-username">@${f.username}</div>
        </div>
        <button class="friend-add ${isAdded ? 'added' : ''}" onclick="toggleMember(${f.id}, '${f.username}', '${f.full_name || f.username}', '${f.avatar || ''}')">
          <i class="fas ${isAdded ? 'fa-times' : 'fa-plus'}"></i>
        </button>
      </div>
    `;
  }).join('');
}

function filterFriends(value) {
  renderFriendList(value);
}

function toggleMember(id, username, fullName, avatar) {
  const index = selectedMembers.findIndex(m => m.id === id);
  if (index > -1) {
    selectedMembers.splice(index, 1);
  } else {
    selectedMembers.push({ id, username, fullName, avatar });
  }
  renderFriendList(document.getElementById('memberSearch').value);
  updateSelectedMembersUI();
  updateCreateButton();
}

function updateSelectedMembersUI() {
  const container = document.getElementById('selectedMembers');
  if (selectedMembers.length === 0) {
    container.innerHTML = `<button class="add-btn" onclick="openAddMembers()">
      <i class="fas fa-plus"></i> Добавить участников
    </button>`;
    return;
  }
  
  let html = '';
  selectedMembers.forEach(m => {
    html += `
      <span class="member-chip">
        ${m.fullName || m.username}
        <button class="remove" onclick="removeMember(${m.id})">✕</button>
      </span>
    `;
  });
  html += `<button class="add-btn" onclick="openAddMembers()">
    <i class="fas fa-plus"></i>
  </button>`;
  container.innerHTML = html;
}

function removeMember(id) {
  selectedMembers = selectedMembers.filter(m => m.id !== id);
  updateSelectedMembersUI();
  updateCreateButton();
  if (document.getElementById('membersModal').classList.contains('active')) {
    renderFriendList(document.getElementById('memberSearch').value);
  }
}

function updateCreateButton() {
  const btn = document.getElementById('createGroupBtn');
  const name = document.getElementById('groupNameInput').value.trim();
  btn.disabled = !(name && selectedMembers.length >= 2);
}

function openAddMembers() {
  document.getElementById('membersModal').classList.add('active');
  document.getElementById('memberSearch').value = '';
  renderFriendList();
}

function closeAddMembers() {
  document.getElementById('membersModal').classList.remove('active');
}

document.getElementById('createGroupBtn').addEventListener('click', function() {
  const name = document.getElementById('groupNameInput').value.trim();
  if (!name) { alert('Введите название группы'); return; }
  if (selectedMembers.length < 2) { alert('Выберите минимум 2 участника'); return; }
  
  const members = selectedMembers.map(m => m.username);
  fetch('/api/create_group', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, members: members })
  })
  .then(r => r.json())
  .then(data => {
    if (data.chat_id) {
      window.location.href = '/chat/' + data.chat_id;
    } else {
      alert(data.error || 'Ошибка создания группы');
    }
  })
  .catch(err => alert('Ошибка: ' + err));
});

document.getElementById('groupNameInput').addEventListener('input', updateCreateButton);

document.addEventListener('DOMContentLoaded', function() {
  loadFriends();
  updateSelectedMembersUI();
  updateCreateButton();
});
</script>
</body>
</html>
