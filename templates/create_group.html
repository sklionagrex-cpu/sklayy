<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sklay — Создать группу</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0b0f;
      color: #f0f0f5;
      min-height: 100vh;
      padding: 16px;
    }
    .back-btn {
      color: #f0f0f5;
      text-decoration: none;
      font-size: 24px;
      display: inline-block;
      margin-bottom: 16px;
    }
    .back-btn:hover { color: #5B6CFF; }
    .page-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      color: #888;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      color: #f0f0f5;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.3s;
    }
    .form-group input:focus {
      border-color: #5B6CFF;
      background: rgba(255,255,255,0.08);
    }
    .friends-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    .friend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      transition: all 0.2s;
    }
    .friend-item:hover {
      background: rgba(255,255,255,0.06);
    }
    .friend-item.selected {
      border-color: #5B6CFF;
      background: rgba(91,108,255,0.1);
    }
    .friend-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(91,108,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .friend-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .friend-info { flex: 1; }
    .friend-name {
      font-weight: 500;
      font-size: 15px;
      color: #f0f0f5;
    }
    .friend-username {
      font-size: 13px;
      color: #888;
    }
    .friend-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #555;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      font-size: 12px;
      color: #fff;
    }
    .friend-item.selected .friend-check {
      background: #5B6CFF;
      border-color: #5B6CFF;
    }
    .selected-count {
      margin: 12px 0;
      color: #888;
      font-size: 14px;
    }
    .selected-count span {
      color: #5B6CFF;
      font-weight: 600;
    }
    .btn-create {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #5B6CFF;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      margin-top: 16px;
    }
    .btn-create:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(91,108,255,0.3);
    }
    .btn-create:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .empty-state {
      text-align: center;
      color: #666;
      padding: 40px 20px;
    }
  </style>
</head>
<body>

<a href="/app" class="back-btn"><i class="fas fa-arrow-left"></i> Назад</a>
<h1 class="page-title">👥 Создать группу</h1>

<div class="form-group">
  <label>Название группы</label>
  <input type="text" id="groupNameInput" placeholder="Введите название...">
</div>

<div class="form-group">
  <label>Выберите участников (минимум 2)</label>
  <div class="selected-count">Выбрано: <span id="selectedCount">0</span></div>
  <div class="friends-list" id="friendsList">
    <div class="empty-state">⏳ Загрузка друзей...</div>
  </div>
</div>

<button class="btn-create" id="createGroupBtn" disabled>Создать группу</button>

<script>
let selectedFriends = [];

function loadFriends() {
  const container = document.getElementById('friendsList');
  fetch('/api/friends')
    .then(r => r.json())
    .then(friends => {
      if (!friends || friends.length === 0) {
        container.innerHTML = '<div class="empty-state">У вас нет друзей</div>';
        return;
      }
      container.innerHTML = friends.map(f => {
        const avatarHtml = f.avatar && f.avatar.startsWith('/static/uploads/')
          ? `<img src="${f.avatar}" alt="Avatar">`
          : (f.avatar || '👤');
        return `
          <div class="friend-item" data-id="${f.id}" onclick="toggleFriend(${f.id})">
            <div class="friend-avatar">${avatarHtml}</div>
            <div class="friend-info">
              <div class="friend-name">${f.full_name || f.username}</div>
              <div class="friend-username">@${f.username}</div>
            </div>
            <div class="friend-check"><i class="fas fa-check"></i></div>
          </div>
        `;
      }).join('');
    })
    .catch(err => {
      console.error('Ошибка загрузки друзей:', err);
      container.innerHTML = '<div class="empty-state">Ошибка загрузки друзей</div>';
    });
}

function toggleFriend(id) {
  const item = document.querySelector(`.friend-item[data-id="${id}"]`);
  if (!item) return;
  
  const index = selectedFriends.indexOf(id);
  if (index > -1) {
    selectedFriends.splice(index, 1);
    item.classList.remove('selected');
  } else {
    selectedFriends.push(id);
    item.classList.add('selected');
  }
  
  updateUI();
}

function updateUI() {
  const count = selectedFriends.length;
  document.getElementById('selectedCount').textContent = count;
  const btn = document.getElementById('createGroupBtn');
  btn.disabled = count < 2;
}

document.getElementById('createGroupBtn').addEventListener('click', function() {
  const name = document.getElementById('groupNameInput').value.trim();
  if (!name) { alert('Введите название группы'); return; }
  if (selectedFriends.length < 2) { alert('Выберите минимум 2 участника'); return; }
  
  // Получаем имена выбранных друзей
  const selectedNames = [];
  document.querySelectorAll('.friend-item.selected').forEach(el => {
    const username = el.querySelector('.friend-username').textContent.replace('@', '');
    selectedNames.push(username);
  });
  
  fetch('/api/create_group', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, members: selectedNames })
  })
  .then(r => r.json())
  .then(data => {
    if (data.chat_id) {
      window.location.href = '/chat/' + data.chat_id;
    } else {
      alert(data.error || 'Ошибка создания группы');
    }
  })
  .catch(err => alert('Ошибка: ' + err));
});

loadFriends();
</script>
</body>
</html>
