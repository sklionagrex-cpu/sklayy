<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sklay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0b0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .logo {
      font-size: 48px;
      font-weight: 700;
      color: #5B6CFF;
      margin-bottom: 8px;
      text-shadow: 0 0 40px rgba(91,108,255,0.2);
    }
    .subtitle {
      color: #888;
      font-size: 16px;
      margin-bottom: 40px;
    }
    .btn {
      display: block;
      width: 100%;
      max-width: 300px;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      text-align: center;
      text-decoration: none;
      transition: all 0.3s;
      margin: 8px auto;
    }
    .btn-primary {
      background: #5B6CFF;
      color: #fff;
      box-shadow: 0 0 30px rgba(91,108,255,0.2);
    }
    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 0 40px rgba(91,108,255,0.4);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: #f0f0f5;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
    }
    .footer {
      margin-top: 60px;
      color: #555;
      font-size: 13px;
      text-align: center;
    }
    .footer span {
      color: #5B6CFF;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="logo">◈ Sklay</div>
  <div class="subtitle">Новое поколение общения</div>
  
  <a href="/login" class="btn btn-secondary">Войти</a>
  <a href="/register" class="btn btn-primary">Создать аккаунт</a>

  <div class="footer">Prod by <span>Skleo</span></div>
</body>
</html>
